[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/bootstrap",
    "crates/delivery"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
# Crate internal
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }
delivery = { path = "crates/delivery" }

# Crate eksternal
anyhow = "1"
argon2 = "0.6.0"
async-trait = "0.1.89"
axum = "0.8"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "chrono", "migrate"] }
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std", "json"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "cors", "request-id", "timeout", "limit", "catch-panic", "compression-gzip", "sensitive-headers"] }
uuid = { version = "1.18.0", features = ["serde", "v7"] }
